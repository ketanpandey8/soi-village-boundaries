<meta charset="utf-8">
<title>Goa Village Boundaries — Survey of India</title>
<style>
  :root{
    --bg:#f6f3ee; --panel:#fffdf9; --ink:#1a1e22; --muted:#6b6862;
    --line:#e4ddd2; --line-strong:#c9c0b1;
    --accent:#0e7c86; --accent-ink:#0a5157;
    --map-bg:#eef0ec; --map-sea:#dce8ea; --boundary:#b9b3a7;
    --shadow:0 1px 2px rgba(40,34,24,.06),0 8px 24px rgba(40,34,24,.10);
    /* categorical palette — village category */
    --c-rural:#6ba368; --c-partly:#e0a13c; --c-fully:#d9663f;
    --c-forest:#2f6d4f; --c-island:#3d94a6; --c-others:#9a938a;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14171a; --panel:#1d2125; --ink:#ece7de; --muted:#9a948a;
      --line:#2c3138; --line-strong:#3c434b;
      --accent:#4fc4ce; --accent-ink:#bfeef2;
      --map-bg:#1a1f22; --map-sea:#17282b; --boundary:#4a5158;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
      --c-rural:#7fb877; --c-partly:#e8b25a; --c-fully:#e57a54;
      --c-forest:#4d9670; --c-island:#5bb6c6; --c-others:#8f8880;
    }
  }
  :root[data-theme="light"]{
    --bg:#f6f3ee; --panel:#fffdf9; --ink:#1a1e22; --muted:#6b6862;
    --line:#e4ddd2; --line-strong:#c9c0b1; --accent:#0e7c86; --accent-ink:#0a5157;
    --map-bg:#eef0ec; --map-sea:#dce8ea; --boundary:#b9b3a7;
    --shadow:0 1px 2px rgba(40,34,24,.06),0 8px 24px rgba(40,34,24,.10);
    --c-rural:#6ba368; --c-partly:#e0a13c; --c-fully:#d9663f;
    --c-forest:#2f6d4f; --c-island:#3d94a6; --c-others:#9a938a;
  }
  :root[data-theme="dark"]{
    --bg:#14171a; --panel:#1d2125; --ink:#ece7de; --muted:#9a948a;
    --line:#2c3138; --line-strong:#3c434b; --accent:#4fc4ce; --accent-ink:#bfeef2;
    --map-bg:#1a1f22; --map-sea:#17282b; --boundary:#4a5158;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
    --c-rural:#7fb877; --c-partly:#e8b25a; --c-fully:#e57a54;
    --c-forest:#4d9670; --c-island:#5bb6c6; --c-others:#8f8880;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);
    -webkit-font-smoothing:antialiased;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh}

  header{display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap;
    padding:.85rem 1.1rem;border-bottom:1px solid var(--line);background:var(--panel);z-index:5}
  header h1{font-family:var(--serif);font-weight:600;font-size:1.15rem;margin:0;letter-spacing:.01em}
  header .sub{color:var(--muted);font-size:.82rem}
  header .src{margin-left:auto;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.09em}

  #stage{position:relative;flex:1;min-height:0;background:var(--map-sea)}
  svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--map-sea)}
  svg#map.grabbing{cursor:grabbing}
  #land{fill:var(--map-bg)}
  path.vill{stroke:var(--boundary);stroke-width:.4;vector-effect:non-scaling-stroke;
    transition:opacity .15s;cursor:pointer}
  path.vill:hover{stroke:var(--ink);stroke-width:1.4}
  path.vill.sel{stroke:var(--accent);stroke-width:2}
  path.vill.dim{opacity:.12}

  /* control panel */
  .panel{position:absolute;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow)}
  #controls{top:14px;left:14px;width:270px;max-width:calc(100vw - 28px);padding:13px}
  .field{position:relative}
  .field input{width:100%;padding:.55rem .7rem .55rem 2rem;font:inherit;font-size:.9rem;
    color:var(--ink);background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;outline:none}
  .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
  .field svg{position:absolute;left:.6rem;top:50%;transform:translateY(-50%);width:15px;height:15px;
    stroke:var(--muted);fill:none;stroke-width:2}
  .legend{margin-top:12px;display:flex;flex-direction:column;gap:1px}
  .legend .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
    margin:2px 0 5px}
  .cat{display:flex;align-items:center;gap:.55rem;padding:.32rem .4rem;border-radius:7px;
    cursor:pointer;user-select:none;font-size:.86rem}
  .cat:hover{background:var(--bg)}
  .cat .sw{width:13px;height:13px;border-radius:3px;flex-shrink:0;border:1px solid rgba(0,0,0,.15)}
  .cat .n{flex:1}
  .cat .ct{font-family:var(--mono);font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .cat.off{opacity:.38}
  .cat.off .sw{background:transparent!important}
  .foot{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--muted)}
  .foot b{font-family:var(--mono);color:var(--ink);font-size:.95rem;font-variant-numeric:tabular-nums}

  /* info card */
  #info{bottom:14px;left:14px;width:270px;max-width:calc(100vw - 28px);padding:14px;display:none}
  #info.show{display:block}
  #info .vname{font-family:var(--serif);font-size:1.15rem;font-weight:600;margin:0 0 2px;text-wrap:balance}
  #info .chip{display:inline-flex;align-items:center;gap:.4rem;font-size:.72rem;
    padding:.2rem .5rem;border-radius:999px;background:var(--bg);border:1px solid var(--line);margin-bottom:9px}
  #info .chip .dot{width:8px;height:8px;border-radius:50%}
  #info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.32rem .8rem;font-size:.84rem}
  #info dt{color:var(--muted)}
  #info dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  #info dd.code{font-family:var(--mono);font-size:.8rem}
  #info .hint{color:var(--muted);font-size:.78rem;margin:0}

  /* zoom + theme buttons */
  #tools{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:6px}
  #tools button{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);border-radius:9px;box-shadow:var(--shadow);cursor:pointer;font-size:1rem;
    display:grid;place-items:center;line-height:1}
  #tools button:hover{border-color:var(--accent);color:var(--accent)}
  #tools button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .cred{position:absolute;bottom:8px;right:12px;font-size:.68rem;color:var(--muted);
    background:color-mix(in srgb,var(--panel) 80%,transparent);padding:2px 7px;border-radius:6px}

  @media (max-width:620px){
    #controls{width:calc(100vw - 28px)}
    #info{width:calc(100vw - 28px);bottom:14px}
    header .src{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header>
    <h1>Goa — Village Boundaries</h1>
    <span class="sub">420 villages · 2 districts · 12 taluks</span>

  <div id="stage">
    <svg id="map" xmlns="http://www.w3.org/2000/svg">

    <div class="panel" id="controls">

        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>

      <button id="zreset" title="Reset view" aria-label="Reset view">⤾</button>
      <button id="theme" title="Toggle theme" aria-label="Toggle light/dark">◐</button>
    </div>
    <div class="cred">Data © Survey of India · National Geospatial Policy 2022</div>
  </div>
</div>

  const off = new Set();

  // ---- Web Mercator projection + fit ----
  const merc = (lon,lat)=>[lon, Math.log(Math.tan(Math.PI/4 + lat*Math.PI/360))*180/Math.PI];
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  const eachRing = (g,f)=>{ const t=g.type,c=g.coordinates;
    if(t==="Polygon") c.forEach(f);
    else if(t==="MultiPolygon") c.forEach(p=>p.forEach(f)); };
  feats.forEach(ft=>eachRing(ft.geometry,ring=>ring.forEach(([lo,la])=>{
    const[x,y]=merc(lo,la); if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
  })));
  const W=1000, pad=24;
  const scale=(W-2*pad)/(maxX-minX);
  const H=(maxY-minY)*scale+2*pad;
  const px=x=>pad+(x-minX)*scale;
  const py=y=>H-pad-(y-minY)*scale; // flip Y

  function pathFor(g){
    let d="";
    eachRing(g,ring=>{
      ring.forEach(([lo,la],i)=>{ const[x,y]=merc(lo,la);
        d+=(i?"L":"M")+px(x).toFixed(1)+" "+py(y).toFixed(1); });
      d+="Z";
    });
    return d;
  }

  const svg=document.getElementById("map");
  const scene=document.getElementById("scene");
  svg.setAttribute("viewBox",`0 0 ${W} ${H.toFixed(1)}`);
  const NS="http://www.w3.org/2000/svg";
  const nodes=[];
  feats.forEach((ft,i)=>{
    const p=document.createElementNS(NS,"path");
    p.setAttribute("d",pathFor(ft.geometry));
    p.setAttribute("class","vill");
    p.style.fill=`var(${catVar(ft.properties.cat)})`;
    p.__i=i;
    scene.appendChild(p); nodes.push(p);
  });

  // ---- pan / zoom ----
  let k=1,tx=0,ty=0;
  const apply=()=>scene.setAttribute("transform",`translate(${tx} ${ty}) scale(${k})`);
  function zoomAt(cx,cy,factor){
    const nk=Math.min(40,Math.max(1,k*factor));
    const r=nk/k; tx=cx-(cx-tx)*r; ty=cy-(cy-ty)*r; k=nk; clamp(); apply();
  }
  function clamp(){ // keep map from drifting fully offscreen
    const vw=W,vh=H;
    tx=Math.min(vw*.5, Math.max(vw*.5-vw*k, tx));
    ty=Math.min(vh*.5, Math.max(vh*.5-vh*k, ty));
  }
  const pt=svg.createSVGPoint();
  function toSVG(ev){ pt.x=ev.clientX; pt.y=ev.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse()); }
  svg.addEventListener("wheel",ev=>{ ev.preventDefault();
    const p=toSVG(ev); zoomAt(p.x,p.y, ev.deltaY<0?1.15:1/1.15); },{passive:false});
  let drag=null;
  svg.addEventListener("pointerdown",ev=>{ drag={x:ev.clientX,y:ev.clientY,tx,ty,moved:0};
    svg.setPointerCapture(ev.pointerId); svg.classList.add("grabbing"); });
  svg.addEventListener("pointermove",ev=>{ if(!drag)return;
    const s=(svg.viewBox.baseVal.width)/svg.clientWidth;
    const dx=(ev.clientX-drag.x)*s, dy=(ev.clientY-drag.y)*s;
    drag.moved+=Math.abs(ev.clientX-drag.x)+Math.abs(ev.clientY-drag.y);
    tx=drag.tx+dx; ty=drag.ty+dy; clamp(); apply(); });
  const endDrag=ev=>{ if(drag)svg.classList.remove("grabbing"); drag=null; };
  svg.addEventListener("pointerup",endDrag); svg.addEventListener("pointercancel",endDrag);
  document.getElementById("zin").onclick=()=>zoomAt(W/2,H/2,1.4);
  document.getElementById("zout").onclick=()=>zoomAt(W/2,H/2,1/1.4);
  document.getElementById("zreset").onclick=()=>{k=1;tx=0;ty=0;apply();};

  // ---- info card ----
  const info=document.getElementById("info");
  let locked=null;
  function show(i){
    const p=feats[i].properties;
    const areaTxt=p.area_km2!=null?p.area_km2.toLocaleString()+" km²":"—";
    info.innerHTML=`
      <p class="vname">${esc(p.name||"Unnamed")}</p>
      <span class="chip"><span class="dot" style="background:var(${catVar(p.cat)})"></span>${catLabel(p.cat)}</span>
      <dl>
        <dt>Taluk</dt><dd>${esc(cap(p.sub))}</dd>
        <dt>District</dt><dd>${esc(cap(p.dist))}</dd>
        <dt>Area</dt><dd>${areaTxt}</dd>
        <dt>LGD code</dt><dd class="code">${esc(p.lgd||"—")}</dd>
      </dl>`;
    info.classList.add("show");
  }
  function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  function cap(s){return String(s||"").toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());}
  scene.addEventListener("pointerover",ev=>{ const t=ev.target; if(t.__i==null)return;
    if(locked==null) show(t.__i); });
  scene.addEventListener("click",ev=>{ const t=ev.target; if(t.__i==null){return;}
    if(drag&&drag.moved>6)return;
    if(locked===t){ locked=null; t.classList.remove("sel"); return; }
    if(locked)locked.classList.remove("sel");
    locked=t; t.classList.add("sel"); show(t.__i); });

  // ---- legend / category filter ----
  const legend=document.getElementById("legend");
  const counts={}; feats.forEach(f=>counts[f.properties.cat]=(counts[f.properties.cat]||0)+1);
  CATS.forEach(([cat,v])=>{
    if(!counts[cat])return;
    const el=document.createElement("div");
    el.className="cat"; el.dataset.cat=cat;
    el.innerHTML=`<span class="sw" style="background:var(${v})"></span>
      <span class="n">${catLabel(cat)}</span><span class="ct">${counts[cat]}</span>`;
    el.onclick=()=>{ off.has(cat)?off.delete(cat):off.add(cat);
      el.classList.toggle("off",off.has(cat)); refilter(); };
    legend.appendChild(el);
  });

  // ---- search + filter ----
  const search=document.getElementById("search");
  const countEl=document.getElementById("count");
  function refilter(){
    const q=search.value.trim().toLowerCase();
    let n=0,firstMatch=-1;
    feats.forEach((f,i)=>{
      const p=f.properties;
      const catOK=!off.has(p.cat);
      const qOK=!q || (p.name||"").toLowerCase().includes(q)
                    || (p.sub||"").toLowerCase().includes(q)
                    || (p.dist||"").toLowerCase().includes(q);
      const vis=catOK&&qOK;
      nodes[i].classList.toggle("dim",!vis);
      if(vis){n++; if(firstMatch<0)firstMatch=i;}
    });
    countEl.textContent=n;
    return firstMatch;
  }
  let searchT;
  search.addEventListener("input",()=>{ clearTimeout(searchT);
    searchT=setTimeout(refilter,120); });
  search.addEventListener("keydown",ev=>{ if(ev.key!=="Enter")return;
    const fm=refilter(); if(fm<0)return;
    // zoom to first match's bbox
    const b=bboxOf(feats[fm].geometry);
    const bw=b.x2-b.x1||10,bh=b.y2-b.y1||10;
    const nk=Math.min(24,Math.max(2, .55*Math.min(W/bw,H/bh)));
    k=nk; tx=W/2-((b.x1+b.x2)/2)*k; ty=H/2-((b.y1+b.y2)/2)*k; clamp(); apply();
    if(locked)locked.classList.remove("sel");
    locked=nodes[fm]; locked.classList.add("sel"); show(fm);
  });
  function bboxOf(g){ let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
    eachRing(g,ring=>ring.forEach(([lo,la])=>{const[mx,my]=merc(lo,la);
      const X=px(mx),Y=py(my); if(X<x1)x1=X;if(X>x2)x2=X;if(Y<y1)y1=Y;if(Y>y2)y2=Y;}));
    return{x1,y1,x2,y2}; }

  // ---- theme toggle ----
  document.getElementById("theme").onclick=()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const dark=cur? cur==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
    document.documentElement.setAttribute("data-theme", dark?"light":"dark");
  };
  apply();
})();
</script>
