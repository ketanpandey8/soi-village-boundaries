# Runs build/check.sh on every pull request and push to main: the page matches the app
# source, the scripts parse, there are no em dashes, and the Worker config is valid.
name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: build/check.sh
      - name: Worker config and bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/worker
